name: Locale release check

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  locales:
    name: Primary key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run test:i18n
