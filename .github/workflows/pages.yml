name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "cursor/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # GitHub Pages vynucuje HTTPS. Vlastní doména: Settings → Pages → Enforce HTTPS.
          PUBLIC_SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          PUBLIC_SITE_URL: https://garath33.github.io
          PUBLIC_BASE_PATH: /ecomo
          # Analytika bez cookies. Vyplňte jen jednu variantu v repo Variables. Prázdné = vypnuto.
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          PUBLIC_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
