name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "cursor/**"
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Build production site
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          PUBLIC_SITE_ENV: production
          PUBLIC_SITE_URL: https://garath33.github.io
          PUBLIC_BASE_PATH: /ecomo
      - name: Assert production has no preview bar
        if: github.ref == 'refs/heads/main'
        run: node scripts/assert-preview-banner.mjs dist production
      - name: Build production plus this branch preview
        if: github.ref != 'refs/heads/main'
        run: bash scripts/assemble-pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ github.ref_name == 'main' && 'https://garath33.github.io/ecomo/' || 'https://garath33.github.io/ecomo/preview/' }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
