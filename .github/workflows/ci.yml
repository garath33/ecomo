name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  test:
    name: Lint, regression, smoke, e2e, visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:validate
      - name: Regression, e2e and visual regression
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Build with site root at /
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /
          PUBLIC_SITE_URL: http://127.0.0.1
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          failIfEmpty: true
          lycheeVersion: v0.20.1
          args: --offline --no-progress --include-fragments --index-files index.html --root-dir ${{ github.workspace }}/dist "dist/**/*.html"
